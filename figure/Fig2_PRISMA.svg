<line x1="580" y1="259" x2="620" y2="259" stroke="#a05252" stroke-width="2" marker-end="url(#ah)"/>
<line x1="580" y1="679" x2="620" y2="679" stroke="#6b8e6b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="920" width="760" height="110" rx="6" ry="6" fill="#fbfbfb" stroke="#bbb" stroke-width="1"/>
<text x="56" y="942" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Empirical result (see 3.4)</text>
<text x="56" y="960" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#333">All 7 overlapping trios were same-sign; the correction narrowed every CI (-0.2% to -16.0%</text>
<text x="56" y="975" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#333">among the 5 non-degenerate trios, 0 flips). Two (S320, S293) are degenerate self-mediating</text>
<text x="56" y="990" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#333">designs (exposure = mediator accession) flagged as boundary illustrations, not findings.</text>
